<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>時間割</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<header>
  <h1 id="title">時間割</h1>

  <div class="term-box">
    <input type="date" id="startDate">
    ～
    <input type="date" id="endDate">
    <button id="saveTerm" type="button">保存</button>
  </div>
</header>


<div id="app"></div>


<!-- モーダル -->
<div id="modal" class="modal hidden">

  <div class="modal-box">

    <h2>授業管理</h2>

    <div class="tabs">
      <button id="tabInfo" type="button" class="active">授業情報</button>
      <button id="tabAttend" type="button">出席管理</button>
    </div>


    <div id="infoArea">

      <label>授業名
        <input id="className">
      </label>

      <label>教室
        <input id="room">
      </label>

      <label>教員
        <input id="teacher">
      </label>

      <label>メモ
        <textarea id="note"></textarea>
      </label>

      <label>色
        <input type="color" id="color" value="#90caf9">
      </label>

    </div>


    <div id="attendArea" class="hidden"></div>


    <div class="btn-area">
      <button id="saveBtn" type="button">保存</button>
      <button id="closeBtn" type="button">閉じる</button>
    </div>

  </div>

</div>


<script src="app.js"></script>
</body>
</html>
